<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — WizNerdZ Pixel Paragon</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05060a" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="icon" href="assets/logo_mark.png" type="image/png" />
  <style>
    :root {
      --bg: #05060a;
      --text: #e8eef6;
      --muted: #8b96a8;
      --green: #9dffb0;
      --blue: #3d9be8;
      --line: rgba(168, 212, 255, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 700px 400px at 50% 0%, rgba(61, 155, 232, 0.2), transparent 60%),
        linear-gradient(165deg, #020308, #061428);
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      padding: 32px 28px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: linear-gradient(155deg, rgba(244, 247, 251, 0.08), rgba(6, 20, 40, 0.95));
      box-shadow: 0 0 48px rgba(18, 64, 110, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    img.logo {
      height: 56px;
      image-rendering: pixelated;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 8px;
      background: #000;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
    }
    h1 span { color: var(--green); text-shadow: 0 0 12px rgba(157, 255, 176, 0.4); }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
    a.btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      color: #020308;
      background: linear-gradient(180deg, #d8ffe4, var(--green) 50%, #3d9a68);
      box-shadow: 0 0 24px rgba(157, 255, 176, 0.35);
    }
    a.btn:hover { filter: brightness(1.05); }
    .links { margin-top: 16px; font-size: 0.85rem; }
    .links a { color: #a8d4ff; margin: 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/logo_mark.png" alt="WizNerdZ" width="56" height="56" />
    <h1><span>404</span> — spell fizzled</h1>
    <p>
      That page is not in the grimoire. The collection lives on the home page —
      nominate community PFPs, preview wizards, and connect Sage.
    </p>
    <a class="btn" href="./">Return to WizNerdZ</a>
    <div class="links">
      <a href="./#nominate">Nominate</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="https://x.com/FiendStudios">@FiendStudios</a>
    </div>
  </div>
</body>
</html>
