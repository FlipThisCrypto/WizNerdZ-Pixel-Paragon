  <style>

    }
    #doc pre {
      background: rgba(2, 3, 8, 0.8); border: 1px solid rgba(168, 212, 255, 0.14);

<body>
  <div class="wrap">
    <nav class="top">
      <a href="index.html">Home</a> · <a href="mint.html">Summon</a> ·
      <a href="sealed-boxes.html">Sealed boxes</a>
    </nav>

    <main id="doc" aria-busy="true"><p>Loading the commitment…</p></main>

    <footer class="src">
      This page renders <a id="src-link" href="mint/COMMITMENT.md">the raw markdown</a>
      auditors should read directly. Published values live in
      <a href="mint/commitment.json"><code>mint/commitment.json</code></a>.
    </footer>
  </div>

  <script>
    /**
     * Minimal renderer for COMMITMENT.md, deliberately not a general markdown
     * engine: it handles exactly the constructs that document uses (headers,
     * bold, inline code, fenced code, tables, lists, rules, links) and
     * escapes everything else. The .md file stays the single source of truth
     * so the rendered page can never drift from what auditors read raw.
     */
    (async function () {
      const doc = document.getElementById("doc");

      // Allowlisted docs only - ?doc= must never become an arbitrary-fetch
      // surface. Unknown values fall back to the commitment.
      const DOCS = {
        COMMITMENT: "mint/COMMITMENT.md",
        MINT: "MINT.md",
        COLLECTION_README: "COLLECTION_README.md",
        OPS: "OPS.md",
        ARCHITECTURE: "ARCHITECTURE.md",
        SLO: "SLO.md",
        INCIDENTS: "INCIDENTS.md",
        GOVERNANCE: "GOVERNANCE.md",
      };
      const key = new URLSearchParams(location.search).get("doc");
      const path = DOCS[key] || DOCS.COMMITMENT;

      let md;
      try {
        const res = await fetch(path, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        md = await res.text();
      } catch (e) {
        doc.innerHTML =
          '<h1>Verify the allocation</h1><p>Could not load the commitment document. ' +
          'Read it directly: <a href="' + path + '">' + path + "</a></p>";
        doc.removeAttribute("aria-busy");
        return;
      }

      const esc = (s) =>
        s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      const inline = (s) =>
        esc(s)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
            /^(https?:|mailto:|[\w./-]+$)/.test(u) ? `<a href="${u}">${t}</a>` : m
          );

      const lines = md.split(/\r?\n/);
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const ln = lines[i];

        if (ln.startsWith("```")) {
          const buf = [];
          i++;
          while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
          i++;
          out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        if (/^---+\s*$/.test(ln)) { out.push("<hr>"); i++; continue; }
        if (ln.startsWith("### ")) { out.push(`<h3>${inline(ln.slice(4))}</h3>`); i++; continue; }
        if (ln.startsWith("## "))  { out.push(`<h2>${inline(ln.slice(3))}</h2>`);  i++; continue; }
        if (ln.startsWith("# "))   { out.push(`<h1>${inline(ln.slice(2))}</h1>`);  i++; continue; }

        if (ln.trim().startsWith("|")) {
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(lines[i++]);
          const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
          const head = cells(rows[0]);
          const body = rows.slice(1).filter((r) => !/^[\s|:-]+$/.test(r)).map(cells);
          out.push(
            '<div class="tablewrap"><table><thead><tr>' +
            head.map((h) => `<th>${inline(h)}</th>`).join("") +
            "</tr></thead><tbody>" +
            body.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
            "</tbody></table></div>"
          );
          continue;
        }

        if (/^\s*[-*] /.test(ln)) {
          const items = [];
          while (i < lines.length && /^\s*[-*] /.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*] /, ""));
            i++;
          }
          out.push("<ul>" + items.map((x) => `<li>${inline(x)}</li>`).join("") + "</ul>");
          continue;
        }
        if (/^\s*\d+\. /.test(ln)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\. /.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+\. /, ""));
            i++;
          }
          out.push("<ol>" + items.map((x) => `<li>${inline(x)}</li>`).join("") + "</ol>");
          continue;
        }

        if (ln.trim() === "") { i++; continue; }

        const buf = [ln];
        i++;
        while (i < lines.length && lines[i].trim() !== "" &&
               !/^(#|\||```|---|\s*[-*] |\s*\d+\. )/.test(lines[i])) {
          buf.push(lines[i++]);
        }
        out.push(`<p>${inline(buf.join(" "))}</p>`);
      }

      doc.innerHTML = out.join("\n");
      doc.removeAttribute("aria-busy");
      const h1text = doc.querySelector("h1")?.textContent;
      if (h1text) document.title = h1text; // h1 already carries the brand
      const src = document.getElementById("src-link");
      if (src) { src.href = path; src.textContent = path; }
    })();
  </script>
</body>
