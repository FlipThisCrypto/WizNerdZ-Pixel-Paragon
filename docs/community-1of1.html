<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WizNerdZ 1-of-1s — Named + Community</title>
  <meta name="description" content="All 71 WizNerdZ one-of-ones: 10 named specials and 61 Chia community legends (incl. Ice Labs). Drop coming soon." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://flipthiscrypto.github.io/WizNerdZ-Pixel-Paragon/community-1of1.html" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="icon" href="assets/logo_mark.png" type="image/png" />
  <meta property="og:title" content="WizNerdZ 1-of-1s" />
  <meta property="og:description" content="71 one-of-ones in the 8,888 WizNerdZ collection — named specials + community." />
  <meta property="og:image" content="https://flipthiscrypto.github.io/WizNerdZ-Pixel-Paragon/specials/Fiend.png" />
  <style>
    body {
      margin: 0;
      font-family: var(--font-ui, system-ui, sans-serif);
      background: linear-gradient(165deg, #020308, #061428);
      color: #e8eef6;
      padding: 24px 16px 48px;
    }
    a { color: #a8d4ff; text-decoration: none; }
    a:hover { color: #9dffb0; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.45rem; letter-spacing: 0.04em; }
    h1 span { color: #9dffb0; }
    h2 { margin: 28px 0 10px; font-size: 1.1rem; color: #a8d4ff; }
    .muted { color: #8b96a8; font-size: 0.9rem; line-height: 1.5; }
    .badge {
      display: inline-block;
      margin: 8px 8px 0 0;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(157, 255, 176, 0.35);
      background: rgba(157, 255, 176, 0.08);
      color: #9dffb0;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    figure {
      margin: 0;
      background: #0a0c12;
      border: 1px solid rgba(168, 212, 255, 0.22);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(18, 64, 110, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    figure:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(61, 155, 232, 0.4);
    }
    img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
      background: #111;
    }
    figcaption {
      font-size: 0.68rem;
      padding: 6px 8px 8px;
      color: #9b93b5;
      line-height: 1.35;
    }
    figcaption strong { color: #9dffb0; display: block; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="muted">
      <a href="./">← Home</a> ·
      <a href="token.html?id=42">Token viewer</a> ·
      <a href="https://x.com/FiendStudios" target="_blank" rel="noopener">@FiendStudios</a>
    </p>
    <h1>WizNerdZ <span>1-of-1s</span></h1>
    <p class="muted">
      Full set of one-of-ones in the collection — ready for the drop.
      Simple community display names (not legal names).
    </p>
    <span class="badge" id="count-badge">Loading…</span>

    <h2>Named specials</h2>
    <div class="gallery" id="named-g"></div>

    <h2>Community</h2>
    <div class="gallery" id="comm-g"></div>
  </div>
  <script>
    function card(item) {
      const id = item.token_id;
      const label = item.display_name || ("#" + id);
      const sub = item.handle
        ? item.handle + " · #" + id
        : (item.kind === "named" ? "Named · #" + id : "#" + id);
      const fig = document.createElement("figure");
      fig.innerHTML =
        '<a href="token.html?id=' +
        id +
        '"><img src="images/' +
        id +
        '.png" alt="' +
        label +
        '" loading="lazy" decoding="async" /></a>' +
        "<figcaption><strong>" +
        label +
        "</strong>" +
        sub +
        "</figcaption>";
      return fig;
    }

    fetch("ones/catalog.json")
      .then((r) => r.json())
      .then((data) => {
        const named = data.named_specials || [];
        const comm = data.community_1of1 || [];
        document.getElementById("count-badge").textContent =
          (data.total_1of1 || named.length + comm.length) +
          " one-of-ones · " +
          named.length +
          " named · " +
          comm.length +
          " community";
        const ng = document.getElementById("named-g");
        named
          .slice()
          .sort((a, b) => a.token_id - b.token_id)
          .forEach((item) => ng.appendChild(card(item)));
        const cg = document.getElementById("comm-g");
        comm
          .slice()
          .sort((a, b) => a.token_id - b.token_id)
          .forEach((item) => cg.appendChild(card(item)));
      })
      .catch((e) => {
        document.getElementById("count-badge").textContent = "Failed to load catalog";
        document.getElementById("comm-g").textContent = String(e);
      });
  </script>
</body>
</html>
