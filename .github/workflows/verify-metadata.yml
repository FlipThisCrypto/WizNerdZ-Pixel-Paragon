name: verify-metadata

on:
  push:
    paths:
      - "docs/metadata/**"
      - "docs/images/**"
      - "scripts/verify_metadata.py"
      - ".github/workflows/verify-metadata.yml"
  pull_request:
    paths:
      - "docs/metadata/**"
      - "docs/images/**"
      - "scripts/verify_metadata.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CHIP-0007 absolute image URLs
        run: python scripts/verify_metadata.py
